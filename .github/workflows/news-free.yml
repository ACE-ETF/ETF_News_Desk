name: ETF News Free Runner
on:
  schedule:
    # UTC -> KST 01:10, 07:10, 13:10, 19:10 (every six hours)
    - cron: '10 4,10,16,22 * * *'
    # KST business-day 07:40; server checks Korean holidays.
    - cron: '40 22 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'stored-release reuses saved articles without collecting again'
        required: true
        default: stored-release
        type: choice
        options: [stored-release, release, stage, status]
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-free.yml'
      - 'scripts/free-news-runner.py'
      - 'scripts/test-free-news-runner.py'
      - 'scripts/news-free-requirements.txt'
permissions:
  contents: read
concurrency:
  group: etf-news-collector
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test-free-news-runner.py' -v
      - run: python -m py_compile scripts/free-news-runner.py public/collector.py
  run:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_COLLECTOR_KEY: ${{ secrets.SITE_COLLECTOR_KEY }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      INPUT_MODE: ${{ inputs.mode }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select mode and validate secret
        id: mode
        run: |
          python - <<'PY'
          import os
          event = os.environ["EVENT_NAME"]
          mode = "release" if os.environ.get("EVENT_SCHEDULE") == "40 22 * * 0-4" else "stage"
          if event == "workflow_dispatch":
              mode = os.environ.get("INPUT_MODE") or "stored-release"
          elif event == "push":
              mode = "stored-release"
          if not os.environ.get("SITE_COLLECTOR_KEY") and mode != "status":
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("Setup required: add Actions secret SITE_COLLECTOR_KEY with the existing Site COLLECTOR_KEY. No collection/publication attempted.\n")
              raise SystemExit("SETUP_REQUIRED: SITE_COLLECTOR_KEY is not configured.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("mode=" + mode + "\n")
          PY
      - uses: actions/cache@v4
        if: steps.mode.outputs.mode == 'release' || steps.mode.outputs.mode == 'stored-release'
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-ko-v1
      - name: Install free local text tools
        if: steps.mode.outputs.mode == 'release' || steps.mode.outputs.mode == 'stored-release'
        run: python -m pip install -r scripts/news-free-requirements.txt
      - name: Run existing collection or publication pipeline
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/free-news-runner.py --mode "$RUN_MODE"
