name: Deploy ETF News Desk
on:
  push:
    branches: [main]
  schedule:
    - cron: '10 4,10,16,22 * * *'
    # Start the morning runner early; release remains gated at 07:40 KST.
    - cron: '45 21 * * 0-4'
    - cron: '40 22 * * 0-4'
    # GitHub backup checks; the independent cloud watchdog runs at 07:40/08:40 KST.
    - cron: '47 22 * * 0-4'
    - cron: '17 23 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'release collects once; stored-release only processes saved articles'
        required: true
        default: stored-release
        type: choice
        options: [release, stored-release, stage]
permissions:
  contents: read
concurrency:
  group: etf-news-production
  cancel-in-progress: false
  # Preserve a pending publication when another collection/recovery event arrives.
  queue: max
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    outputs:
      edition: ${{ steps.edition.outputs.metadata }}
    permissions:
      contents: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      INPUT_MODE: ${{ inputs.mode }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: news-data
          path: source/_news_state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: source/scripts/static-news-requirements.txt
      - name: Test publication boundaries, deduplication and feed limits
        working-directory: source
        run: |
          python scripts/test-static-news.py -v
          python scripts/test-publication-recovery.py
      - name: Hold early morning runner until the Korean publication cutoff
        if: github.event_name == 'schedule' && github.event.schedule == '45 21 * * 0-4'
        timeout-minutes: 65
        working-directory: source
        run: |
          python - <<'PY'
          import importlib.util,time
          spec=importlib.util.spec_from_file_location("pipeline","scripts/static-news.py")
          pipeline=importlib.util.module_from_spec(spec);spec.loader.exec_module(pipeline)
          def wait_seconds(now,closed):
              local=now.astimezone(pipeline.KST)
              if not pipeline.business(local.date(),closed):return 0
              cutoff=local.replace(hour=7,minute=40,second=0,microsecond=0)
              return max(0,(cutoff-local).total_seconds())
          closed=pipeline.holidays()
          while True:
              seconds=wait_seconds(pipeline.datetime.now(pipeline.UTC),closed)
              if seconds<=0:break
              if seconds>3900:raise RuntimeError("Early runner outside bounded morning window")
              print("Waiting for 07:40 KST publication cutoff",flush=True)
              time.sleep(min(seconds,30))
          PY
      - name: Choose collection or release
        id: mode
        run: |
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("pipeline","source/scripts/static-news.py")
          pipeline=importlib.util.module_from_spec(spec);spec.loader.exec_module(pipeline)
          event=os.environ["EVENT_NAME"]
          schedule=os.environ.get("EVENT_SCHEDULE", "")
          mode="stored-release"
          if event=="schedule":
              if schedule=="10 4,10,16,22 * * *":mode="stage"
              elif schedule in {"45 21 * * 0-4","40 22 * * 0-4"}:mode="release"
          elif event=="workflow_dispatch":mode=os.environ.get("INPUT_MODE") or "stored-release"
          publication_mode=mode
          now=pipeline.datetime.now(pipeline.UTC);closed=pipeline.holidays()
          latest=pipeline.read(Path("source/_news_state/public/latest.json"),{})
          expected=pipeline.window(now,closed)
          stale=pipeline.due(now,closed) and latest.get("window")!=expected
          # A cloud watchdog writes this bounded request through the Contents API.
          # Push-triggered jobs do not depend on GitHub's cron scheduler.
          if event=="push" and stale:
              retry=pipeline.read(Path("source/ops/publication-retry.json"),{})
              try:
                  age=(now-pipeline.stamp(retry.get("requestedAt",""))).total_seconds()
              except (ValueError,TypeError,AttributeError):
                  age=-1
              if (retry.get("windowEnd")==expected["end"] and 0<=age<=900
                  and retry.get("mode") in {"release","stored-release"}):
                  mode=retry["mode"];publication_mode=mode
          if mode=="stage" and stale:publication_mode="stored-release"
          state=pipeline.read(Path("source/_news_state/state.json"),pipeline.new_state())
          selected=[a for a in state["articles"].values() if expected["start"]<=a["published"]<expected["end"]]
          pipeline.editorial(state,selected)
          needs_translation=any(a.get("language")=="en" and not pipeline.routine(a) and not state["summaries"].get(a["id"]) for a in selected)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("mode="+mode+"\npublication_mode="+publication_mode+"\nneeds_translation="+str(needs_translation).lower()+"\n")
          pipeline.log(collectionMode=mode,publicationMode=publication_mode,recoveringStaleEdition=stale)
          PY
      - name: Claim the round before any feed request
        working-directory: source
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python scripts/static-news.py --mode "$RUN_MODE" --phase claim
          git -C _news_state config user.name "ETF News Desk"
          git -C _news_state config user.email "newsdesk@users.noreply.github.com"
          git -C _news_state add state.json
          if ! git -C _news_state diff --cached --quiet; then
            git -C _news_state commit -m "Claim bounded news collection round"
            git -C _news_state push origin HEAD:news-data
          fi
      - name: Collect fixed RSS feeds once
        working-directory: source
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python scripts/static-news.py --mode "$RUN_MODE" --phase collect
      - name: Persist collection results
        if: always()
        working-directory: source
        run: |
          git -C _news_state add state.json
          if ! git -C _news_state diff --cached --quiet; then
            git -C _news_state commit -m "Save RSS metadata and provider diagnostics"
            git -C _news_state push origin HEAD:news-data
          fi
      - uses: actions/cache@v4
        if: steps.mode.outputs.publication_mode != 'stage'
        with:
          path: ~/.cache/etf-news
          key: etf-news-en-ko-argos-1-1
      - name: Install free CPU translation and text extraction tools
        timeout-minutes: 3
        if: steps.mode.outputs.publication_mode != 'stage'
        continue-on-error: true
        working-directory: source
        run: python -m pip install -r scripts/static-news-requirements.txt
      - name: Verify free translation model
        timeout-minutes: 2
        if: steps.mode.outputs.publication_mode != 'stage' && steps.mode.outputs.needs_translation == 'true'
        continue-on-error: true
        working-directory: source
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("pipeline","scripts/static-news.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          result=m.offline_translator()("Bond ETF launches in the United States")
          if not m.re.search(r"[가-힣]",result):raise RuntimeError("Translation smoke check failed")
          m.log(translationModelReady=True,example=result)
          PY
      - name: Prepare and publish stored articles
        working-directory: source
        env:
          RUN_MODE: ${{ steps.mode.outputs.publication_mode }}
        run: python scripts/static-news.py --mode "$RUN_MODE" --phase publish
      - name: Export and verify the static edition
        working-directory: source
        run: python scripts/static-news.py --phase export
      - name: Record the edition included in this deployment
        id: edition
        working-directory: source
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path("public/news-data/latest.json").read_text())
          metadata={"window":data["window"],"fetched":data["status"]["fetched"],"updated":data["status"]["updated"]}
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("metadata="+json.dumps(metadata,separators=(",",":"))+"\n")
          PY
      - name: Persist public edition and archive
        if: always()
        working-directory: source
        run: |
          git -C _news_state add state.json
          if [ -d _news_state/public ]; then git -C _news_state add public; fi
          if ! git -C _news_state diff --cached --quiet; then
            git -C _news_state commit -m "Save published edition, translations and day archives"
            git -C _news_state push origin HEAD:news-data
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: source
        run: npm install --prefix pages --ignore-scripts --no-audit --no-fund
      - name: Build existing news interface
        working-directory: source
        run: npm run build --prefix pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy at the existing URL
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live news edition
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_EDITION: ${{ needs.build.outputs.edition }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base=os.environ["LIVE_URL"].rstrip("/")+"/"
          marker="?v="+os.environ["GITHUB_SHA"]
          with urllib.request.urlopen(base+marker,timeout=30) as r:
              assert 'etf-static-data' in r.read().decode(), "Static news source marker missing"
          with urllib.request.urlopen(base+"news-data/latest.json"+marker,timeout=30) as r:
              data=json.load(r)
          expected=json.loads(os.environ["EXPECTED_EDITION"])
          assert data["window"]==expected["window"], "Live edition window differs from the deployment"
          assert data["status"]["updated"]==expected["updated"], "Live edition is an older revision"
          assert data["status"]["fetched"]==expected["fetched"], "Live edition count differs from the deployment"
          assert len(data["articles"])>0
          assert len(data["articles"])==data["status"]["fetched"]
          assert all(data["window"]["start"]<=a["published"]<data["window"]["end"] for a in data["articles"])
          remaining=sum(a.get("language")=="en" and not a.get("summary") for a in data["articles"])
          print(json.dumps({"verifiedLive":True,"url":base,"count":len(data["articles"]),"window":data["window"],"untranslated":remaining},ensure_ascii=False))
          PY
